name: iOS Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build KMP Framework and iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build KMP iOS Shared Framework
      run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

    - name: Build iOS App (Xcode)
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath build-output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Upload iOS Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: |
          build-output/Build/Products/Debug-iphoneos/*.app
          shared/build/bin/iosArm64/debugFramework/
