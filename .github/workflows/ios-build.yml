name: iOS Simulator Build

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build KMP iOS Simulator App
    runs-on: macos-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Java
      # =====================================================

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
          cache: gradle


      # =====================================================
      # 3. Gradle
      # =====================================================

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Java
        run: |
          java -version
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3


      # =====================================================
      # 4. CocoaPods
      # =====================================================

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version


      # =====================================================
      # 5. Generate Dummy Framework
      # =====================================================

      - name: Generate Dummy Framework
        run: |
          ./gradlew :shared:generateDummyFramework --stacktrace


      # =====================================================
      # 6. Install CocoaPods
      # =====================================================

      - name: CocoaPods Install
        run: |
          cd iosApp
          pod install


      # =====================================================
      # 7. Detect Workspace
      # =====================================================

      - name: Detect Xcode Workspace
        run: |
          set -e

          WORKSPACE=$(find iosApp \
            -name "*.xcworkspace" \
            -type d | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found."

            find iosApp -maxdepth 5 \
              \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

            exit 1
          fi

          echo "Workspace found:"
          echo "$WORKSPACE"

          echo "WORKSPACE_PATH=$WORKSPACE" >> "$GITHUB_ENV"


      # =====================================================
      # 8. Show Xcode Schemes
      # =====================================================

      - name: Show Xcode Schemes
        run: |
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -list


      # =====================================================
      # 9. Build KMP Framework for iOS Simulator
      # =====================================================

      - name: Build KMP Simulator Framework
        run: |
          ./gradlew \
            :shared:linkPodDebugFrameworkIosSimulatorArm64 \
            --stacktrace


      # =====================================================
      # 10. Build iOS Simulator App
      # =====================================================

      - name: Build iOS Simulator App
        run: |
          set -e

          mkdir -p build-output

          echo "Building iOS Simulator application..."

          xcodebuild build \
            -workspace "$WORKSPACE_PATH" \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "Simulator build completed."


      # =====================================================
      # 11. Find APP
      # =====================================================

      - name: Find Simulator App
        run: |
          echo "Searching for .app..."

          find build-output \
            -name "*.app" \
            -type d


      # =====================================================
      # 12. Verify GoogleService Info
      # =====================================================

      - name: Verify GoogleService-Info.plist
        run: |
          APP_PATH=$(find build-output \
            -path "*Build/Products/Debug-iphonesimulator/*.app" \
            -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Simulator .app not found."
            exit 1
          fi

          echo "App found:"
          echo "$APP_PATH"

          if [ -f "$APP_PATH/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist is present."
          else
            echo "WARNING: GoogleService-Info.plist is NOT inside app bundle."

            if [ -f "iosApp/iosApp/GoogleService-Info.plist" ]; then
              cp \
                iosApp/iosApp/GoogleService-Info.plist \
                "$APP_PATH/"

              echo "GoogleService-Info.plist copied into app bundle."
            else
              echo "WARNING: Source GoogleService-Info.plist not found."
            fi
          fi


      # =====================================================
      # 13. Create ZIP for Appetize
      # =====================================================

      - name: Package Simulator App
        run: |
          set -e

          APP_PATH=$(find build-output \
            -path "*Build/Products/Debug-iphonesimulator/*.app" \
            -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No simulator .app found."
            exit 1
          fi

          echo "Packaging:"
          echo "$APP_PATH"

          cd "$(dirname "$APP_PATH")"

          zip -r "$GITHUB_WORKSPACE/ios-simulator-app.zip" \
            "$(basename "$APP_PATH")"

          echo "Created:"
          ls -lh "$GITHUB_WORKSPACE/ios-simulator-app.zip"


      # =====================================================
      # 14. Upload Simulator App
      # =====================================================

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4

        with:
          name: ios-simulator-app
          path: |
            ios-simulator-app.zip
            shared/build/cocoapods/framework/Shared.framework

          if-no-files-found: error