name: iOS Simulator Build for Appetize

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS Simulator .app for Appetize
    runs-on: macos-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Java
      # =====================================================

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"
          cache: gradle


      # =====================================================
      # 3. Gradle
      # =====================================================

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =====================================================
      # 4. Install CocoaPods
      # =====================================================

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version


      # =====================================================
      # 5. Generate KMP Dummy Framework
      # =====================================================

      - name: Generate Dummy Framework
        run: |
          ./gradlew :shared:generateDummyFramework --stacktrace


      # =====================================================
      # 6. Install CocoaPods
      # =====================================================

      - name: CocoaPods Install
        working-directory: iosApp
        run: |
          pod install --repo-update


      # =====================================================
      # 7. Find Workspace
      # =====================================================

      - name: Detect Xcode Workspace
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find iosApp \
            -name "*.xcworkspace" \
            -type d \
            | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found."

            echo "Available Xcode files:"
            find iosApp -maxdepth 6 \
              \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

            exit 1
          fi

          echo "Workspace found:"
          echo "$WORKSPACE"

          echo "WORKSPACE_PATH=$WORKSPACE" >> "$GITHUB_ENV"


      # =====================================================
      # 8. Show Schemes
      # =====================================================

      - name: Show Xcode Schemes
        run: |
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -list


      # =====================================================
      # 9. Build KMP Framework for Simulator
      # =====================================================

      - name: Build KMP Simulator Framework
        run: |
          ./gradlew \
            :shared:linkPodDebugFrameworkIosSimulatorArm64 \
            --stacktrace


      # =====================================================
      # 10. Clean Build Directory
      # =====================================================

      - name: Clean Build Output
        run: |
          rm -rf build-output
          mkdir -p build-output


      # =====================================================
      # 11. Build iOS Simulator .app
      # =====================================================

      - name: Build iOS Simulator App
        run: |
          set -e

          echo "=========================================="
          echo "Building iOS Simulator App"
          echo "=========================================="

          xcodebuild build \
            -workspace "$WORKSPACE_PATH" \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$GITHUB_WORKSPACE/build-output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "=========================================="
          echo "Xcode build completed"
          echo "=========================================="


      # =====================================================
      # 12. Find .app
      # =====================================================

      - name: Locate Simulator .app
        shell: bash
        run: |
          set -e

          echo "Searching for simulator .app..."

          APP_PATH=$(find "$GITHUB_WORKSPACE/build-output" \
            -type d \
            -path "*/Build/Products/Debug-iphonesimulator/*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found."

            echo ""
            echo "All .app files:"
            find "$GITHUB_WORKSPACE/build-output" \
              -type d \
              -name "*.app" \
              -print

            echo ""
            echo "Build directory:"
            find "$GITHUB_WORKSPACE/build-output" \
              -maxdepth 7 \
              -print

            exit 1
          fi

          echo "=========================================="
          echo "APP FOUND"
          echo "=========================================="
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"


      # =====================================================
      # 13. Inspect .app
      # =====================================================

      - name: Verify Simulator App
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APP CONTENT"
          echo "=========================================="

          ls -lah "$APP_PATH"

          APP_NAME=$(basename "$APP_PATH" .app)

          echo ""
          echo "App name:"
          echo "$APP_NAME"

          echo ""
          echo "Checking executable..."

          if [ ! -f "$APP_PATH/$APP_NAME" ]; then
            echo "ERROR: App executable not found:"
            echo "$APP_PATH/$APP_NAME"
            exit 1
          fi

          echo "Executable found."

          echo ""
          echo "Binary architecture:"
          file "$APP_PATH/$APP_NAME"

          echo ""
          echo "Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true


      # =====================================================
      # 14. Verify Firebase plist
      # =====================================================

      - name: Verify GoogleService-Info.plist
        shell: bash
        run: |
          set -e

          if [ -f "$APP_PATH/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist is present inside .app"
          else
            echo "WARNING: GoogleService-Info.plist is NOT inside .app"

            if [ -f "iosApp/iosApp/GoogleService-Info.plist" ]; then
              echo "Copying GoogleService-Info.plist..."

              cp \
                "iosApp/iosApp/GoogleService-Info.plist" \
                "$APP_PATH/"

              echo "GoogleService-Info.plist copied."
            else
              echo "WARNING: Source GoogleService-Info.plist not found."
            fi
          fi


      # =====================================================
      # 15. Prepare Appetize Package
      # =====================================================

      - name: Prepare Appetize Package
        shell: bash
        run: |
          set -e

          rm -rf appetize-package
          mkdir -p appetize-package

          echo "Copying .app..."

          cp -R "$APP_PATH" appetize-package/

          echo ""
          echo "Package contents:"
          find appetize-package \
            -maxdepth 3 \
            -print


      # =====================================================
      # 16. Create ZIP
      # =====================================================

      - name: Create Appetize ZIP
        shell: bash
        run: |
          set -e

          cd appetize-package

          APP_NAME=$(basename "$APP_PATH")

          echo "Creating:"
          echo "$APP_NAME"

          zip -r \
            "$GITHUB_WORKSPACE/ios-app-for-appetize.zip" \
            "$APP_NAME"

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "=========================================="
          echo "ZIP CREATED"
          echo "=========================================="

          ls -lh ios-app-for-appetize.zip


      # =====================================================
      # 17. Verify ZIP
      # =====================================================

      - name: Verify Appetize ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ZIP CONTENT"
          echo "=========================================="

          unzip -l ios-app-for-appetize.zip

          echo ""
          echo "Checking for .app..."

          if unzip -l ios-app-for-appetize.zip \
            | grep -E '\.app/' > /dev/null; then

            echo "SUCCESS: .app exists inside ZIP."

          else

            echo "ERROR: .app was NOT found inside ZIP."
            exit 1

          fi


      # =====================================================
      # 18. Upload Artifact
      # =====================================================

      - name: Upload Appetize Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-for-appetize
          path: ios-app-for-appetize.zip
          if-no-files-found: error