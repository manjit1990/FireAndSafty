name: iOS Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build KMP Framework and iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Generate Dummy Framework for CocoaPods
      run: ./gradlew :shared:generateDummyFramework

    - name: CocoaPods Install
      run: |
        cd iosApp
        pod install

    - name: Build KMP iOS Shared Framework
      run: ./gradlew :shared:linkPodDebugFrameworkIosArm64 --stacktrace

    - name: Build iOS App (Xcode)
      run: |
        xcodebuild -workspace iosApp/iosApp.xcworkspace \
          -scheme iosApp \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath build-output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package as IPA
      run: |
        mkdir -p Payload
        cp -r build-output/Build/Products/Debug-iphoneos/*.app Payload/
        zip -r iosApp.ipa Payload

    - name: Upload iOS Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: |
          iosApp.ipa
          shared/build/cocoapods/framework/Shared.framework
