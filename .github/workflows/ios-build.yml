name: iOS Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build KMP Framework and iOS App
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Verify Java
      run: |
        java -version
        ./gradlew --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version

    - name: Install Apple Certificate (Optional)
      if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
      env:
        CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

    - name: Install Provisioning Profile (Optional)
      if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      run: |
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Update Project Configuration (Optional)
      if: ${{ env.APPLE_TEAM_ID != '' }}
      env:
        TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        BUNDLE_ID: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
      run: |
        CONFIG_PATH="iosApp/Configuration/Config.xcconfig"
        [ ! -z "$TEAM_ID" ] && sed -i '' "s/TEAM_ID=.*/TEAM_ID=$TEAM_ID/" "$CONFIG_PATH"
        [ ! -z "$BUNDLE_ID" ] && sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER=.*/PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID/" "$CONFIG_PATH"

    - name: Generate Dummy Framework for CocoaPods
      run: ./gradlew :shared:generateDummyFramework

    - name: CocoaPods Install
      run: |
        cd iosApp
        pod install

    - name: Build KMP iOS Shared Framework
      run: ./gradlew :shared:linkPodDebugFrameworkIosArm64 --stacktrace

    - name: Build iOS App
      run: |
        if [ ! -z "$IOS_CERTIFICATE_BASE64" ]; then
          echo "Building with Code Signing..."
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build-output/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
        else
          echo "Building without Code Signing (For Sideloadly)..."
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        fi

    - name: Inject Resources and Package IPA
      run: |
        mkdir -p Payload
        if [ -d "build-output/Build/Products/Debug-iphoneos" ]; then
          cp -R build-output/Build/Products/Debug-iphoneos/*.app Payload/
        elif [ -d "build-output/iosApp.xcarchive/Products/Applications" ]; then
          cp -R build-output/iosApp.xcarchive/Products/Applications/*.app Payload/
        else
          echo "Error: No built .app bundle found!"
          exit 1
        fi
        
        APP_PATH=$(find Payload -maxdepth 1 -name "*.app")
        echo "Found app bundle at: $APP_PATH"
        
        # Ensure GoogleService-Info.plist is inside .app bundle
        if [ -f "iosApp/iosApp/GoogleService-Info.plist" ]; then
          cp iosApp/iosApp/GoogleService-Info.plist "$APP_PATH/"
          echo "GoogleService-Info.plist verified and copied to bundle."
        fi
        
        zip -r iosApp.ipa Payload

    - name: Upload iOS Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-debug
        path: iosApp.ipa
